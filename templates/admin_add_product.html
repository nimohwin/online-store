<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 40px 0; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .btn { margin-top: 15px; width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #218838; }
        .error { color: red; text-align: center; }
        .back { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add a Product</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form action="/admin/products" method="post" enctype="multipart/form-data">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>

            <label for="price">Price (KES)</label>
            <input type="number" id="price" name="price" min="0" required>

            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Bags, Tops, Blankets">

            <label for="image">Photo</label>
            <input type="file" id="image" name="image" accept="image/*" required>

            <button type="submit" class="btn">Add Product</button>
        </form>
        <div class="back"><a href="/">Back to store</a></div>
    </div>
</body>
</html>
